server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # single-page game: never serve a stale shell
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/html application/javascript;
}